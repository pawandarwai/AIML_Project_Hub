<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin — AIML Project Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F5;--card:#fff;--ink:#141F2B;--soft:#4C5A67;--line:#D6DEE4;--teal:#1F6F78;--gold:#C89B3C;--done:#2F7D4F;--prog:#B07F17;--pend:#B4472A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'IBM Plex Sans',system-ui,sans-serif}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}
header{background:#101A25;color:#fff;padding:18px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font:600 20px 'Space Grotesk',sans-serif;margin:0}
h2{font:600 18px 'Space Grotesk',sans-serif;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin:24px 0}
label{display:block;font-size:13px;font-weight:500;color:var(--soft);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.btn{font:500 14px inherit;font-family:inherit;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:#154D54}
.btn.pri:disabled{opacity:.5;cursor:default}
.btn.del{color:var(--pend);border-color:var(--pend)}
.btn.del:hover{background:var(--pend);color:#fff}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.hint{font-size:13px;color:var(--soft);margin:8px 0 0}
.msg{display:none;margin-top:14px;padding:12px 16px;border-radius:8px;font-size:14px;line-height:1.5}
.msg.ok{display:block;background:#E4F0E8;color:var(--done)}
.msg.err{display:block;background:#F5E4DE;color:var(--pend)}
.msg.info{display:block;background:#F6EDD9;color:var(--prog)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--soft);font-weight:600;padding:8px;border-bottom:2px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#f8fafc}
.st{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st.done{background:#E4F0E8;color:var(--done)}
.st.progress{background:#F6EDD9;color:var(--prog)}
.st.pending{background:#F5E4DE;color:var(--pend)}
.acts{white-space:nowrap;text-align:right;display:flex;gap:6px;justify-content:flex-end}
dialog{border:none;border-radius:16px;padding:28px;width:min(580px,95vw);max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(10,18,28,.55)}
.dirty{font-size:13px;color:var(--prog);font-weight:600}
#app{display:none}
.sync-status{font-size:12px;padding:4px 10px;border-radius:99px;font-weight:500}
.sync-status.github{background:#E4F0E8;color:var(--done)}
.sync-status.sheet{background:#E4F0E8;color:var(--done)}
.sync-status.fail{background:#F5E4DE;color:var(--pend)}
.export-opt{display:block;width:100%;text-align:left;padding:11px 16px;font:500 13px 'IBM Plex Sans',inherit;background:none;border:none;color:var(--ink);cursor:pointer}
.export-opt:hover{background:var(--bg)}
.export-opt+.export-opt{border-top:1px solid var(--line)}
.sync-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.progress-preview{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.progress-preview span{display:block;height:100%;border-radius:99px;background:var(--teal);transition:width .2s}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}.hide-m{display:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>⚙️ Admin · AIML Project Hub</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <a href="index.html" class="btn" style="text-decoration:none">← View site</a>
      <button class="btn" id="logout" style="display:none">Disconnect</button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- LOGIN -->
  <section class="card" id="login">
    <h2>Connect to GitHub</h2>
    <p class="hint">Changes publish hone par GitHub <b>aur</b> Google Sheet dono update honge.</p>
    <div class="g2">
      <div><label>GitHub Username</label><input id="owner" placeholder="your-username"></div>
      <div><label>Repository Name</label><input id="repo" placeholder="aiml-project-hub"></div>
      <div><label>Branch</label><input id="branch" value="main"></div>
      <div><label>Access Token</label><input id="token" type="password" placeholder="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" autocomplete="off"></div>
    </div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:14px;cursor:pointer">
      <input type="checkbox" id="remember" style="width:auto"> Remember on this device
    </label>
    <p style="margin-top:16px"><button class="btn pri" id="connect">Connect →</button></p>
    <div class="msg" id="loginMsg"></div>
  </section>

  <!-- APP -->
  <section id="app">
    <div class="card">
      <div class="bar">
        <div>
          <h2>Projects <span id="count" style="color:var(--soft);font-weight:400"></span></h2>
          <div class="sync-row">
            <span class="dirty" id="dirty"></span>
            <span class="sync-status" id="ghStatus" style="display:none"></span>
            <span class="sync-status" id="shStatus" style="display:none"></span>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" id="addBtn">+ Add Project</button>
          <button class="btn" id="refreshBtn">↻ Refresh from Sheet</button>
          <div style="position:relative;display:inline-block">
            <button class="btn" id="exportBtn">Export ▾</button>
            <div id="exportMenu" style="display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:180px;z-index:99;overflow:hidden">
              <button class="export-opt" data-type="json">📄 Export as JSON</button>
              <button class="export-opt" data-type="csv">📊 Export as CSV</button>
              <button class="export-opt" data-type="pdf">🖨 Export as PDF</button>
            </div>
          </div>
          <button class="btn pri" id="publish" disabled>🚀 Publish (GitHub + Sheet)</button>
        </div>
      </div>
      <div class="msg" id="appMsg"></div>
      <div style="overflow-x:auto;margin-top:16px">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Project Name</th>
              <th class="hide-m">Leader</th>
              <th>Status</th>
              <th class="hide-m">Progress</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="hint" style="margin-top:16px">💡 Publish karne ke baad GitHub Pages 1-2 min mein aur Google Sheet turant update hogi.</p>
    </div>
  </section>
</main>

<!-- EDIT DIALOG -->
<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle" style="margin:0 0 16px;font-family:'Space Grotesk',sans-serif">Add Project</h2>

    <div class="g2">
      <div>
        <label>Project ID</label>
        <input id="f_id" required placeholder="P-01">
      </div>
      <div>
        <label>Status</label>
        <select id="f_status">
          <option value="Not Started">Not Started</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
    </div>

    <label>Project Name</label>
    <input id="f_name" required placeholder="Project ka naam">

    <label>Description</label>
    <textarea id="f_desc" rows="2" placeholder="Short description"></textarea>

    <label>Tech Stack (comma se alag karo)</label>
    <input id="f_stack" placeholder="Python, OpenCV, Flask">

    <label>Progress: <b id="pv">0</b>%</label>
    <input id="f_progress" type="range" min="0" max="100" step="5" value="0">
    <div class="progress-preview"><span id="progressBar" style="width:0%"></span></div>

    <div class="g2">
      <div>
        <label>Team Leader</label>
        <input id="f_leader" required placeholder="Leader ka naam">
      </div>
      <div>
        <label>Mentor</label>
        <input id="f_mentor" value="Priyanka Bhatele Mam">
      </div>
    </div>

    <label>Members (comma se alag karo)</label>
    <input id="f_members" placeholder="Rahul, Priya, Karan">

    <div class="g2">
      <div>
        <label>GitHub Repository Link</label>
        <input id="f_repo" placeholder="https://github.com/…">
      </div>
      <div>
        <label>Live Project Link (optional)</label>
        <input id="f_live" placeholder="https://…">
      </div>
    </div>

    <div class="msg" id="formMsg"></div>

    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button class="btn del" type="button" id="deleteBtn" style="display:none">Delete Project</button>
      <button class="btn pri" type="submit">Save Project</button>
    </div>
  </form>
</dialog>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz8CUdFwg3lNr1ast4UMvyr7_NzDUA7OuQd5LHMRKQ7o8r1Z6PkxsZro7euptI4g4OTEg/exec';
const FILE = 'projects.json';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusLabel = {'Completed':'Completed','In Progress':'In Progress','Not Started':'Not Started',done:'Completed',progress:'In Progress',pending:'Not Started'};
const cssClass = st => st==='Completed'?'done':st==='In Progress'?'progress':'pending';

let projects = [], sha = null, dirty = false, editing = null, cfg = {};

function say(el, type, text){ el.className = 'msg ' + type; el.textContent = text; }
function setDirty(v){ dirty = v; $('dirty').textContent = v ? '● Unpublished changes' : ''; $('publish').disabled = !v; }

const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
const githubApi = (path, opt={}) => fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, {
  ...opt,
  headers: {Accept:'application/vnd.github+json', Authorization:'Bearer '+cfg.token, 'Content-Type':'application/json'}
});

// Auto-fill credentials from github.io URL
(function restoreSession(){
  const h = location.hostname;
  if(h.endsWith('.github.io')){
    $('owner').value = h.split('.')[0];
    $('repo').value  = location.pathname.split('/')[1] || '';
  }
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('hub-admin') || sessionStorage.getItem('hub-admin')); }catch(_){}
  if(saved){
    ['owner','repo','branch','token'].forEach(k => $(k).value = saved[k] || '');
    $('remember').checked = !!localStorage.getItem('hub-admin');
  }
})();

// ── LOAD DATA ──
// Step 1: get SHA from GitHub (required for publishing)
// Step 2: load latest project data from Apps Script (which reads the Sheet directly)
// Step 3: fallback to projects.json on GitHub if Apps Script fails
async function loadData(){
  // Get SHA from GitHub
  const ghRes = await githubApi(`${FILE}?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`);
  if(ghRes.status === 401) throw new Error('Token is invalid or expired.');
  if(ghRes.status === 404){ sha = null; }
  else if(!ghRes.ok) throw new Error('GitHub error ' + ghRes.status + '. Check username, repo and branch.');
  else { const d = await ghRes.json(); sha = d.sha; }

  // Try Apps Script to get Sheet data
  try{
    const asRes = await fetch(APPS_SCRIPT_URL + '?action=read');
    if(asRes.ok){
      const d = await asRes.json();
      if(d.ok && Array.isArray(d.projects) && d.projects.length){
        projects = d.projects;
        return 'sheet';
      }
    }
  }catch(_){}

  // Fallback: load from projects.json
  if(sha){
    try{
      const jRes = await githubApi(`${FILE}?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`);
      if(jRes.ok){ const d = await jRes.json(); projects = JSON.parse(b64dec(d.content)); return 'json'; }
    }catch(_){}
  }

  projects = [];
  return 'empty';
}

// ── CONNECT ──
$('connect').onclick = async () => {
  cfg = {
    owner:  $('owner').value.trim(),
    repo:   $('repo').value.trim(),
    branch: $('branch').value.trim() || 'main',
    token:  $('token').value.trim()
  };
  if(!cfg.owner || !cfg.repo || !cfg.token) return say($('loginMsg'),'err','Username, repository and token are required.');
  say($('loginMsg'),'info','Connecting…');
  try{
    const source = await loadData();
    const store = $('remember').checked ? localStorage : sessionStorage;
    localStorage.removeItem('hub-admin'); sessionStorage.removeItem('hub-admin');
    try{ store.setItem('hub-admin', JSON.stringify(cfg)); }catch(_){}
    $('login').style.display  = 'none';
    $('app').style.display    = 'block';
    $('logout').style.display = '';
    renderRows(); setDirty(false);
    if(source === 'sheet') say($('appMsg'),'ok','✓ Latest data loaded from Google Sheet.');
    else if(source === 'json') say($('appMsg'),'info','Sheet unavailable — data loaded from projects.json.');
    else say($('appMsg'),'info','No data found. Add projects and publish.');
  }catch(e){ say($('loginMsg'),'err', e.message); }
};

$('logout').onclick = () => {
  localStorage.removeItem('hub-admin');
  sessionStorage.removeItem('hub-admin');
  location.reload();
};

window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });

// ── TABLE ──
function renderRows(){
  $('count').textContent = `(${projects.length})`;
  $('rows').innerHTML = projects.map((p, i) => `
    <tr>
      <td><b>${esc(p.id)}</b></td>
      <td>${esc(p.name)}</td>
      <td class="hide-m">${esc(p.leader)}</td>
      <td><span class="st ${cssClass(p.status)}">${statusLabel[p.status]||esc(p.status)}</span></td>
      <td class="hide-m">${p.progress || 0}%</td>
      <td class="acts">
        <button class="btn" style="padding:5px 10px;font-size:13px" data-edit="${i}">Edit</button>
      </td>
    </tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--soft);padding:30px">No projects yet. Click "Add Project".</td></tr>';
}

$('rows').onclick = e => {
  const ed = e.target.dataset.edit;
  if(ed !== undefined) openForm(+ed);
};

// ── FORM ──
$('f_progress').oninput = () => {
  $('pv').textContent = $('f_progress').value;
  $('progressBar').style.width = $('f_progress').value + '%';
};

function nextId(){
  const nums = projects.map(p => parseInt(String(p.id).replace(/\D/g,''))).filter(Number.isFinite);
  return 'P-' + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(2, '0');
}

function openForm(i){
  editing = i;
  const p = i === null
    ? {id:nextId(), status:'Not Started', progress:0, mentor:'Priyanka Bhatele Mam', stack:[], members:[]}
    : projects[i];

  $('dlgTitle').textContent   = i === null ? 'Add Project' : 'Edit Project';
  $('f_id').value             = p.id       || '';
  $('f_name').value           = p.name     || '';
  $('f_desc').value           = p.desc     || '';
  $('f_stack').value          = Array.isArray(p.stack)   ? p.stack.join(', ')   : (p.stack   || '');
  $('f_status').value         = p.status   || 'Not Started';
  $('f_progress').value       = p.progress || 0;
  $('pv').textContent         = p.progress || 0;
  $('progressBar').style.width = (p.progress || 0) + '%';
  $('f_leader').value         = p.leader   || '';
  $('f_mentor').value         = p.mentor   || 'Priyanka Bhatele Mam';
  $('f_members').value        = Array.isArray(p.members) ? p.members.join(', ') : (p.members || '');
  $('f_repo').value           = p.repo === '#' ? '' : (p.repo || '');
  $('f_live').value           = p.liveLink || '';

  $('deleteBtn').style.display = i === null ? 'none' : '';
  $('formMsg').className = 'msg';
  $('dlg').showModal();
}

$('addBtn').onclick   = () => openForm(null);
$('cancelBtn').onclick = () => $('dlg').close();

$('deleteBtn').onclick = () => {
  if(!confirm(`Delete "${projects[editing].name}"?`)) return;
  projects.splice(editing, 1);
  $('dlg').close();
  renderRows();
  setDirty(true);
};

const csvList = s => s.split(',').map(x => x.trim()).filter(Boolean);

$('form').addEventListener('submit', () => {
  const p = {
    id:       $('f_id').value.trim(),
    name:     $('f_name').value.trim(),
    desc:     $('f_desc').value.trim() || 'Coming soon',
    stack:    csvList($('f_stack').value),
    status:   $('f_status').value,
    progress: $('f_status').value === 'Completed' ? 100 : +$('f_progress').value,
    leader:   $('f_leader').value.trim(),
    mentor:   $('f_mentor').value.trim() || 'Priyanka Bhatele Mam',
    members:  csvList($('f_members').value),
    repo:     $('f_repo').value.trim() || '#',
    liveLink: $('f_live').value.trim()
  };

  if(projects.some((x, i) => x.id === p.id && i !== editing)){
    say($('formMsg'), 'err', `ID "${p.id}" is already in use. Choose a different ID.`);
    return;
  }

  if(editing === null) projects.push(p);
  else projects[editing] = p;

  renderRows();
  setDirty(true);
});

// ── PUBLISH (GitHub + Sheet) ──
function showSync(ghOk, shOk){
  const gh = $('ghStatus'), sh = $('shStatus');
  gh.style.display = ''; sh.style.display = '';
  gh.className = 'sync-status ' + (ghOk ? 'github' : 'fail');
  sh.className = 'sync-status ' + (shOk ? 'sheet'  : 'fail');
  gh.textContent = ghOk ? '✓ GitHub updated' : '✗ GitHub failed';
  sh.textContent = shOk ? '✓ Sheet updated'  : '✗ Sheet failed';
}

$('publish').onclick = async () => {
  $('publish').disabled = true;
  $('ghStatus').style.display = 'none';
  $('shStatus').style.display = 'none';
  say($('appMsg'), 'info', 'Publishing…');

  let ghOk = false, shOk = false;

  // Step 1: Update GitHub
  try{
    const body = {
      message: `Update projects (${projects.length}) via admin`,
      content: b64enc(JSON.stringify(projects, null, 2) + '\n'),
      branch:  cfg.branch
    };
    if(sha) body.sha = sha;
    const r = await githubApi(FILE, {method:'PUT', body: JSON.stringify(body)});
    if(r.status === 409 || r.status === 422) throw new Error('File changed on GitHub since you opened this page. Export your data, disconnect, reconnect and try again.');
    if(r.status === 401 || r.status === 403)  throw new Error('Token missing "Contents: Read and write" permission.');
    if(!r.ok) throw new Error('GitHub error ' + r.status);
    sha = (await r.json()).content.sha;
    ghOk = true;
  }catch(e){
    say($('appMsg'), 'err', '⚠ GitHub: ' + e.message);
    showSync(false, false);
    $('publish').disabled = false;
    return;
  }

  // Step 2: Update Google Sheet via Apps Script
  try{
    const r = await fetch(APPS_SCRIPT_URL, {
      method:  'POST',
      body:    JSON.stringify(projects),
      headers: {'Content-Type': 'text/plain'}
    });
    const d = await r.json();
    if(d.ok) shOk = true;
    else throw new Error(d.error || 'Apps Script returned an error.');
  }catch(e){
    console.warn('Sheet update failed:', e.message);
  }

  showSync(ghOk, shOk);
  setDirty(false);

  if(ghOk && shOk){
    say($('appMsg'), 'ok', '✅ GitHub and Google Sheet both updated! Site will go live in 1–2 minutes.');
  } else {
    say($('appMsg'), 'ok', '✅ GitHub updated. ⚠ Sheet sync failed — check Apps Script.');
  }
};

// ── REFRESH FROM SHEET ──
$('refreshBtn').onclick = async () => {
  if(dirty && !confirm('You have unpublished changes. Refresh will discard them. Continue?')) return;
  $('refreshBtn').textContent = '↻ Refreshing…';
  $('refreshBtn').disabled = true;
  try{
    const r = await fetch(APPS_SCRIPT_URL + '?action=read');
    if(!r.ok) throw new Error('Apps Script request failed.');
    const d = await r.json();
    if(d.ok && Array.isArray(d.projects) && d.projects.length){
      projects = d.projects;
      renderRows();
      setDirty(false);
      say($('appMsg'), 'ok', '✓ Data refreshed from Google Sheet.');
    } else {
      throw new Error(d.error || 'No data returned from Sheet.');
    }
  }catch(e){
    say($('appMsg'), 'err', '⚠ Refresh failed: ' + e.message);
  }
  $('refreshBtn').textContent = '↻ Refresh from Sheet';
  $('refreshBtn').disabled = false;
};

// ── EXPORT DROPDOWN ──
const exportMenu = $('exportMenu');
$('exportBtn').onclick = e => { e.stopPropagation(); exportMenu.style.display = exportMenu.style.display === 'none' ? 'block' : 'none'; };
document.addEventListener('click', () => exportMenu.style.display = 'none');

document.querySelectorAll('.export-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    exportMenu.style.display = 'none';
    const type = btn.dataset.type;
    if(type === 'json') exportJSON();
    else if(type === 'csv') exportCSV();
    else if(type === 'pdf') exportPDF();
  });
});

function exportJSON(){
  const a = document.createElement('a');
  a.href     = URL.createObjectURL(new Blob([JSON.stringify(projects, null, 2)], {type:'application/json'}));
  a.download = 'projects.json';
  a.click(); URL.revokeObjectURL(a.href);
}

function exportCSV(){
  const headers = ['ID','Project Name','Description','Tech Stack','Status','Progress','Leader','Members','Mentor','Repository','Live Link'];
  const rows = projects.map(p => [
    p.id, p.name, p.desc,
    Array.isArray(p.stack)   ? p.stack.join(' | ')   : p.stack,
    p.status, p.progress + '%', p.leader,
    Array.isArray(p.members) ? p.members.join(' | ') : p.members,
    p.mentor, p.repo, p.liveLink || ''
  ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href     = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'projects.csv';
  a.click(); URL.revokeObjectURL(a.href);
}
